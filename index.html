<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="description" content="斤、两、克、毫升、杯、磅等重量与容量单位换算；输入几个鸡蛋、几张 A4 纸、几张人民币，直接看多重">
<title>斤两换算</title>
<style>
  /* 配色 token 照搬 data-Calculation */
  :root {
    --bg: #F2F2F7; --card: #FFFFFF; --text: #000000;
    /* 要读的次要文字不用系统灰 #8E8E93（白底只有 3.23:1），用 #6E6E73（5.03:1） */
    --text-2: #6E6E73;
    --accent: #007AFF; --accent-rgb: 0, 122, 255;
    --cell: #F2F2F7; --press: rgba(0, 0, 0, .06); --shadow: rgba(0, 0, 0, .06);
    --warn: #B25000; --invalid: #D70015;
    --line: rgba(60, 60, 67, .18);
    --gutter: 16px;   /* 页面左右留白；吸顶导航上方的遮挡条要伸到同样宽 */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --card: #1C1C1E; --text: #FFFFFF; --text-2: #AEAEB2;
      --accent: #0A84FF; --accent-rgb: 10, 132, 255;
      --cell: #2C2C2E; --press: rgba(255, 255, 255, .10); --shadow: rgba(0, 0, 0, .3);
      --warn: #FFB340; --invalid: #FF6961;
      --line: rgba(84, 84, 88, .6);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { overscroll-behavior-y: contain; }
  /* 聚焦输入框、导航跳转时，浏览器自动滚动都要避开吸顶导航条；高度由 JS 实测写进 --nav-offset，不写死。
     只写在 html 的 scroll-padding 上：卡片再加 scroll-margin 会叠加成两倍（实测落点低了 68px） */
  html { scroll-padding-top: var(--nav-offset, 76px); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.4; -webkit-text-size-adjust: 100%;
    padding: calc(12px + env(safe-area-inset-top)) calc(var(--gutter) + env(safe-area-inset-right))
             calc(32px + env(safe-area-inset-bottom)) calc(var(--gutter) + env(safe-area-inset-left));
  }
  button, select { font: inherit; color: inherit; touch-action: manipulation; }
  .container { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .card { background: var(--card); border-radius: 20px; padding: 16px 14px; box-shadow: 0 8px 24px var(--shadow); }

  /* 模块导航：照搬 data-Calculation 的吸顶分段条（白底 + 蓝色实心药丸；不用半透明毛玻璃——
     那边实测后面的卡片会映出一块浅色，像第二个选中项）。在流里 + sticky：顶部就能用，滑下去自动吸顶 */
  .section-nav { position: sticky; top: calc(8px + env(safe-area-inset-top)); z-index: 90;
    display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--card); box-shadow: 0 8px 24px var(--shadow); }
  /* 导航条上方那 8px 缝原来会透出底下的格子（2026-10-08 审查截图：露出半截「打兰 / 盎司」），用页面底色挡住 */
  .section-nav::before { content: ""; position: absolute; left: calc(-1 * var(--gutter)); right: calc(-1 * var(--gutter));
    bottom: 100%; height: calc(8px + env(safe-area-inset-top)); background: var(--bg); }
  .nav-item { flex: 1; min-height: 44px; border: none; background: transparent; color: #636368;
    font-size: 15px; font-weight: 600; border-radius: 10px; cursor: pointer; transition: background-color .25s, color .25s; }
  @media (prefers-color-scheme: dark) { .nav-item { color: #B8B8BE; } }
  .nav-item[aria-current="true"] { background: var(--accent); color: #FFFFFF; box-shadow: 0 4px 12px rgba(var(--accent-rgb), .35); }
  .nav-item:not([aria-current="true"]):active { background: var(--press); }

  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .head h1, .head h2 { font-size: 20px; font-weight: 800; letter-spacing: -.02em; flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .head h1::before, .head h2::before { content: ""; width: 4px; height: 1.05em; border-radius: 2px; flex: none;
    background: linear-gradient(180deg, var(--accent), #5E5CE6); }

  /* 选物质：原生 select，iPhone 上点开就是系统滚轮 */
  .sub-wrap { position: relative; flex: none; }
  .sub-select { appearance: none; -webkit-appearance: none; min-height: 44px; border: none; border-radius: 12px;
    background: var(--cell); padding: 0 30px 0 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
  .sub-wrap::after { content: ""; position: absolute; right: 13px; top: 50%; width: 7px; height: 7px; pointer-events: none;
    border-right: 2px solid var(--text-2); border-bottom: 2px solid var(--text-2); transform: translateY(-70%) rotate(45deg); }
  .btn-icon { width: 44px; height: 44px; border: none; border-radius: 12px; background: var(--cell); color: var(--accent);
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
  .btn-icon:active, .sub-select:active { background: var(--press); }

  /* 单位：每组一个 3 列网格，标签收进格子里（2026-10-07 用户在 A/B 对比图里选的 B） */
  .group + .group { margin-top: 10px; }
  .cap { display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    font-size: 12px; font-weight: 600; color: var(--text-2); margin: 0 2px 5px; }
  .cap b { color: var(--accent); font-size: 13px; white-space: nowrap; }
  .cap i { font-style: normal; color: var(--warn); white-space: nowrap; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .cell { height: 58px; border-radius: 12px; background: var(--cell); padding: 6px 10px 4px;
    display: flex; flex-direction: column; justify-content: space-between; cursor: text;
    border: 2px solid transparent; transition: border-color .2s, background-color .2s;
    /* 格子尺寸由网格和固定高度决定、跟里面的字无关：隔离起来，改一格的数字不必重排整页 */
    contain: strict; }
  .cell label { font-size: 12.5px; font-weight: 600; color: var(--text-2); line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: text; }
  .cell input { width: 100%; min-width: 0; height: 26px; border: none; outline: none; background: transparent; padding: 0;
    color: var(--text); font-family: inherit; font-size: 17px; font-weight: 700; text-align: right;
    font-variant-numeric: tabular-nums; }
  .cell input::placeholder { color: var(--text-2); opacity: .45; font-weight: 600; }
  /* 正在输入的那一格（换算的起点）：蓝描边 + 浅蓝底 + 蓝标签。聚焦但还没输入时给一层浅一点的提示 */
  .cell.src { border-color: var(--accent); background: rgba(var(--accent-rgb), .10); }
  .cell.src label { color: var(--accent); }
  .cell:focus-within:not(.src) { border-color: rgba(var(--accent-rgb), .45); }
  .cell.invalid input { color: var(--invalid); }
  /* 物品格：数字后面跟量词（张 / 个 / 罐），否则「100 元」格里的 434.8 会被读成钱数 */
  .vrow { display: flex; align-items: baseline; gap: 2px; min-width: 0; }
  .vrow input { flex: 1 1 0; width: 0; }
  .cw { flex: none; font-size: 12px; font-weight: 600; color: var(--text-2); }
  .cell.src .cw { color: var(--accent); }
  /* 量字宽用：和格子里的数字同字体，按 17px 量一次，其他字号按比例换算（不再逐个字号改样式再读 scrollWidth） */
  .meter { position: fixed; left: 0; top: 0; visibility: hidden; pointer-events: none; white-space: pre;
    font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; contain: layout style; }

  /* 参照文字和「更多单位」按钮共用一行：按钮不另占一行，首屏才放得下 */
  .refer-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .refer { flex: 1; min-width: 0; font-size: 14px; color: var(--text-2); overflow-wrap: anywhere; }
  .btn-more { flex: none; min-height: 44px; padding: 0 12px; border: none; border-radius: 12px; background: var(--cell);
    color: var(--accent); font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn-more .chev { width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
    transform: translateY(-2px) rotate(45deg); transition: transform .2s; }
  .btn-more[aria-expanded="true"] .chev { transform: translateY(2px) rotate(-135deg); }
  .btn-more:active { background: var(--press); }
  #more { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .refer b { color: var(--text); font-weight: 700; }
  /* 物品卡底部的合计：输入在物品格时，换算卡已滑出屏幕，这里直接给出克数和斤两 */
  .obj-sum { margin-top: 10px; min-height: 22px; font-size: 14px; color: var(--text-2); overflow-wrap: anywhere; }
  .obj-sum b { color: var(--text); font-weight: 700; }
  .refer .warn { color: var(--warn); display: block; margin-top: 2px; }

  .note { font-size: 12.5px; color: var(--text-2); margin-top: 8px; }

  /* 320 档（iPhone SE 一代）：压尺寸不换形态——每格可用宽度从约 57px 撑到约 72px，8 位数字和「美制液盎司」才放得下 */
  @media (max-width: 359px) {
    :root { --gutter: 12px; }
    .card { padding: 14px 10px; }
    .grid { gap: 6px; }
    .cell { padding: 6px 6px 4px; }
  }

  @media (hover: hover) {
    .btn-icon:hover { background-color: var(--press); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ======== 下拉刷新组件 CSS：原样拷自 references/组件_下拉刷新（v1.7）======== */
  #ptr-indicator { position: fixed; top: calc(-44px + env(safe-area-inset-top, 0px)); left: 50%; margin-left: -18px;
    width: 36px; height: 36px; border-radius: 50%; background: #fff; border: 1px solid #e5e7eb;
    box-shadow: 0 4px 14px rgba(0,0,0,.18); display: flex; align-items: center; justify-content: center;
    color: #2563eb; opacity: 0; pointer-events: none; z-index: 350; }
  #ptr-indicator.ptr-animate { transition: transform .25s ease, opacity .25s ease; }
  #ptr-indicator svg { width: 20px; height: 20px; }
  #ptr-indicator .ptr-arrow { transition: transform .2s ease; }
  #ptr-indicator.ptr-ready .ptr-arrow { transform: rotate(180deg); }
  #ptr-indicator .ptr-spinner { display: none; }
  #ptr-indicator.ptr-loading .ptr-arrow { display: none; }
  #ptr-indicator.ptr-loading .ptr-spinner { display: block; animation: ptr-spin .8s linear infinite; }
  @keyframes ptr-spin { to { transform: rotate(360deg); } }
  #ptr-tip { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(20px); width: max-content; max-width: min(420px, calc(100vw - 2rem));
    background: #1f2937; color: #fff; border-radius: 12px; padding: .85rem 1.1rem; font-size: .9rem; line-height: 1.5;
    z-index: 400; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
  #ptr-tip.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="container">
  <nav class="section-nav" id="sectionNav" aria-label="模块导航">
    <button type="button" class="nav-item" data-target="cardConvert" aria-current="true">换算</button>
    <button type="button" class="nav-item" data-target="cardObjects" aria-current="false">物品</button>
  </nav>

  <section class="card" id="cardConvert" aria-labelledby="ttlConvert">
    <div class="head">
      <h1 id="ttlConvert">斤两换算</h1>
      <div class="sub-wrap"><select class="sub-select" id="sub" aria-label="按什么东西换算重量和容量"></select></div>
      <button type="button" class="btn-icon" id="btnReset" aria-label="归零">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
      </button>
    </div>
    <div id="groups" class="units"></div>
    <div class="refer-row">
      <div class="refer" id="refer" aria-live="polite"></div>
      <button type="button" class="btn-more" id="btnMore" aria-expanded="false" aria-controls="more"><span id="moreText">更多单位</span><span class="chev" aria-hidden="true"></span></button>
    </div>
    <div id="more" class="units" hidden></div>
  </section>

  <section class="card" id="cardObjects" aria-labelledby="ttlObjects">
    <div class="head"><h2 id="ttlObjects">生活物品</h2>
      <button type="button" class="btn-icon" id="btnReset2" aria-label="归零">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
      </button>
    </div>
    <div id="objects" class="units"></div>
    <div class="obj-sum" id="objSum" aria-live="polite"></div>
    <p class="note">每一列按标题里的规格算。鸡蛋取商务部 SB/T 10638 中等蛋（58～64 克）的中值；A4 按 80 克复印纸；饮料和桶装油按包装容量 × 自身密度折成重量，不受上面「按水」选择影响；水泥按 GB 175 每袋 50 千克。人民币克重央行未公布，按百元约 1.15 克的第三方称量值、再按票面面积推算，仅供参考。</p>
  </section>

</div>

<div id="ptr-indicator" aria-hidden="true">
  <svg class="ptr-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
  <svg class="ptr-spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
</div>
<div id="ptr-tip" hidden></div>

<script src="data.js?v=8b94d50c"></script>
<script src="convert.js?v=60036e60"></script>
<script src="pull-to-refresh.js?v=3e961870"></script>
<script>
(function () {
  'use strict';
  var D = window.WV_DATA, C = window.WV;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }

  // 用户输入的是哪一格（换算起点）、输入了什么数、按什么物质换算
  var state = { unitId: null, value: null, sub: D.substances[0].id };
  var tierOf = {};
  D.groups.forEach(function (g) { tierOf[g.id] = g.tier; });
  function isItem(u) { return tierOf[u.group] === 'items'; }
  var inputs = {};

  // ---------- 渲染 ----------
  $('sub').innerHTML = D.substances.map(function (s) {
    return '<option value="' + s.id + '">按' + esc(s.name) + '</option>';
  }).join('');

  // 首屏常用组进 #groups，其余进可展开的 #more
  function groupsHtml(tier) { return D.groups.filter(function (g) { return g.tier === tier; }).map(function (g) {
    var cells = D.units.filter(function (u) { return u.group === g.id; }).map(function (u) {
      var input = '<input id="u_' + u.id + '" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" spellcheck="false" placeholder="0" data-unit="' + u.id + '"' +
        (u.cw ? ' aria-label="' + esc(u.label + '，' + u.cw + '数') + '"' : '') + '>';
      return '<div class="cell" data-unit="' + u.id + '"><label for="u_' + u.id + '">' + esc(u.label) + '</label>' +
        (u.cw ? '<div class="vrow">' + input + '<span class="cw" aria-hidden="true">' + esc(u.cw) + '</span></div>' : input) + '</div>';
    }).join('');
    return '<div class="group" data-group="' + g.id + '"><div class="cap"><span>' + esc(g.name) + '</span>' +
      (g.composite ? '<b data-comp="' + g.id + '"></b>' : '') + (g.note ? '<i>' + esc(g.note) + '</i>' : '') +
      '</div><div class="grid">' + cells + '</div></div>';
  }).join(''); }
  $('groups').innerHTML = groupsHtml('common');
  $('more').innerHTML = groupsHtml('more');
  $('objects').innerHTML = groupsHtml('items');
  var moreCount = $('more').querySelectorAll('.cell').length;
  D.units.forEach(function (u) { inputs[u.id] = $('u_' + u.id); });

  // 数字放不下时：先保持 6 位有效数字缩字号（17 → 12px），还放不下再减有效位数（6 → 3）。
  // 大数由 formatCell 改写成「亿 / 万亿」。起点格是用户自己打的字，只缩字号不改内容。
  // 性能（2026-10-08 审查实测：CPU 降速 6 倍时每按一个键 170～1363 毫秒）。剖析结果：大头不是计算，
  // 而是每次读格子宽度、量文字宽度都逼浏览器把整页（81 个输入框）同步重排一遍。所以现在：
  //   - 格子宽度和内容无关，读一次缓存起来，只在窗口变化 / 展开收起时重读（availCache = null）
  //   - 文字宽度 = 每个字符宽度之和（数字是等宽的 tabular-nums），每个字符只量一次、按 17px 量、其他字号按比例换算
  //   - 格子加了 contain: strict，改一格的字不会牵动整页排版
  var SIZES = [17, 15, 13.5, 12], SIGS = [6, 5, 4, 3];
  var meter = document.createElement('span');
  meter.className = 'meter'; meter.setAttribute('aria-hidden', 'true');
  document.body.appendChild(meter);
  var charW = {};
  // 一批字符一起量：每个字符一个 span，一次排版全部读出
  function measureChars(chars) {
    var todo = chars.filter(function (ch, i) { return !(ch in charW) && chars.indexOf(ch) === i; });
    if (!todo.length) return;
    meter.innerHTML = '';
    var spans = todo.map(function (ch) { var sp = document.createElement('span'); sp.textContent = ch; meter.appendChild(sp); return sp; });
    spans.forEach(function (sp, i) { charW[todo[i]] = sp.getBoundingClientRect().width; });
  }
  measureChars('0123456789.≈×亿万⁰¹²³⁴⁵⁶⁷⁸⁹'.split(''));
  function textWidth(t) {
    var chars = String(t).split('');
    measureChars(chars);   // 只有没见过的字符（用户打了别的东西）才真的去量
    return chars.reduce(function (w, ch) { return w + charW[ch]; }, 0);
  }
  // 能放下这段文字的最大字号；放不下返回 0。留 1.5px 余量（逐字相加不含字距微调，差额在亚像素级）
  function sizeFor(t, avail) {
    var w = textWidth(t);
    for (var i = 0; i < SIZES.length; i++) if (w * SIZES[i] / SIZES[0] <= avail - 1.5) return SIZES[i];
    return 0;
  }
  var availCache = null;
  function availOf() {
    if (!availCache) {
      availCache = {};
      D.units.forEach(function (u) { if (inputs[u.id]) availCache[u.id] = inputs[u.id].clientWidth; });
    }
    return availCache;
  }
  // 一格要显示 x：给出文字和字号。avail 为 0（收起区里看不见的格子）时不量，展开时 setMore 会重算
  function plan(u, x, avail) {
    var texts = isItem(u) ? [C.formatCount(x), C.formatCell(x, 4), C.formatCell(x, 3)]
                          : SIGS.map(function (sig) { return C.formatCell(x, sig); });
    if (!avail) return { text: texts[0], size: 0 };
    for (var i = 0; i < texts.length; i++) { var sz = sizeFor(texts[i], avail); if (sz) return { text: texts[i], size: sz }; }
    // 3 位有效数字都放不下的只会是极小的数（如 0.000000005 吨）：在这个精度下就是约等于 0
    if (Math.abs(x) < 1) return { text: '≈0', size: sizeFor('≈0', avail) || SIZES[SIZES.length - 1] };
    return { text: texts[texts.length - 1], size: SIZES[SIZES.length - 1] };
  }
  // 起点格 / 打到一半的非法输入：只按它自己的文字定字号
  function fitOwn(el) {
    var a = availOf()[el.dataset.unit];
    var sz = a ? sizeFor(el.value, a) : 0;
    el.style.fontSize = (sz || SIZES[SIZES.length - 1]) + 'px';
  }

  function recompute() {
    var has = state.unitId !== null && state.value !== null;
    var r = has ? C.convertAll(state.value, state.unitId, state.sub) : null;
    // 第一步：格子可用宽度（缓存，见上）
    var avail = availOf();
    // 第二步：只算。每格定文字和字号；同一行三格取最小字号（用户有强迫症，一行里大小不一很扎眼）
    var plans = {};
    D.units.forEach(function (u) {
      if (!inputs[u.id]) return;   // 旧页面 + 新数据（缓存错配）时跳过不认识的格子，别让整页报错
      if (u.id === state.unitId) plans[u.id] = { own: true, size: (avail[u.id] && sizeFor(inputs[u.id].value, avail[u.id])) || SIZES[SIZES.length - 1] };
      else plans[u.id] = has ? plan(u, r[u.id], avail[u.id]) : { text: '', size: 0 };
    });
    D.groups.forEach(function (g) {
      var us = D.units.filter(function (u) { return u.group === g.id && plans[u.id]; });
      for (var i = 0; i < us.length; i += 3) {
        var row = us.slice(i, i + 3).map(function (u) { return plans[u.id]; });
        var sized = row.filter(function (p) { return p.size; });
        if (!sized.length) continue;
        var min = Math.min.apply(null, sized.map(function (p) { return p.size; }));
        row.forEach(function (p) { if (p.size || p.text === '') p.size = min; });
      }
    });
    // 第三步：只写
    D.units.forEach(function (u) {
      var el = inputs[u.id], p = plans[u.id];
      if (!el) return;
      var cell = el.closest('.cell');
      cell.classList.toggle('src', u.id === state.unitId);
      if (!p.own) { el.value = p.text; cell.classList.remove('invalid'); }
      el.style.fontSize = p.size ? p.size + 'px' : '';
    });
    D.groups.forEach(function (g) {
      if (!g.composite) return;
      var c = has ? C.formatComposite(r.g, g.composite) : '';
      var b = document.querySelector('[data-comp="' + g.id + '"]');
      if (b) b.textContent = c ? (g.composite === 'jin_old' ? '旧制 ' + c : c) : '';
    });
    var pos = has && state.value > 0;
    var su = has ? C.unitById[state.unitId] : null;
    var sum = $('objSum');
    if (pos) {
      var comp = C.formatComposite(r.g, 'jin');
      sum.innerHTML = '合计 <b>' + esc(C.formatNumber(r.g)) + ' 克</b>' + (comp ? ' = <b>' + esc(comp) + '</b>' : '') +
        (su.vol ? ' · 内装 ' + esc(C.formatNumber(state.value * su.vol)) + ' 毫升'
                : su.kind === 'volume' ? ' · ' + esc(C.formatNumber(r.ml)) + ' 毫升' : '');
    } else sum.textContent = '输入几个、几张，这里显示合计多重，上面所有单位也一起算';
    var refer = $('refer');
    if (!pos) { refer.textContent = '在任意一格输入数字，其余单位自动算出'; return; }
    var sug = C.suggestItems(r.g, state.unitId).map(function (s) { return '<b>' + esc(C.suggestionText(s)) + '</b>'; });
    var sub = C.subById[state.sub];
    // 粉粒状的提示只在真的跨了重量/容量时才有意义：起点是物品格（已按自身密度折好）时不提示
    var cross = sub.granular && !isItem(su);
    refer.innerHTML = (sug.length ? '相当于 ' + sug.join('、') : '') +
      (cross ? '<span class="warn">' + esc(sub.name) + '装得松紧不同，克 ⇄ 毫升只是大概</span>' : '');
  }

  // 刷新（含下拉刷新）后接着用：输入和所选物质存进 sessionStorage，只在这个标签页里有效、关掉就没
  //   （2026-10-08 审查：收起键盘后误拉一下，输入和物质选择就全丢了）
  var STATE_KEY = 'wv.state';
  function saveState() {
    try {
      if (state.unitId === null) sessionStorage.removeItem(STATE_KEY);
      else sessionStorage.setItem(STATE_KEY, JSON.stringify({ u: state.unitId, t: inputs[state.unitId].value, s: state.sub }));
      if (state.unitId === null && state.sub !== D.substances[0].id) sessionStorage.setItem(STATE_KEY, JSON.stringify({ s: state.sub }));
    } catch (err) {}
  }
  function restoreState() {
    var o = null;
    try { o = JSON.parse(sessionStorage.getItem(STATE_KEY) || 'null'); } catch (err) {}
    if (!o) return;
    if (o.s && C.subById[o.s]) { state.sub = o.s; $('sub').value = o.s; }
    var v = o.u && inputs[o.u] ? C.parseInput(o.t) : null;
    if (v !== null) { state.unitId = o.u; state.value = v; inputs[o.u].value = o.t; }
  }

  // ---------- 交互 ----------
  function onUnits(type, fn) { ['groups', 'more', 'objects'].forEach(function (id) { $(id).addEventListener(type, fn); }); }

  // 「更多单位」展开/收起，记住上次的状态（存不了就每次默认收起）
  var MORE_KEY = 'wv.moreOpen';
  function setMore(open) {
    $('more').hidden = !open;
    $('btnMore').setAttribute('aria-expanded', String(open));
    $('moreText').textContent = open ? '收起' : '更多 ' + moreCount + ' 个';
    try { localStorage.setItem(MORE_KEY, open ? '1' : '0'); } catch (err) {}
    // 收起时格子宽度是 0：展开后必须重读宽度、重算一遍
    availCache = null;
    if (open) recompute();
  }
  $('btnMore').addEventListener('click', function () { setMore($('more').hidden); });
  onUnits('input', function (e) {
    var el = e.target;
    if (!el.dataset.unit) return;
    var cell = el.closest('.cell');
    if (el.value.trim() === '') { cell.classList.remove('invalid'); state.unitId = null; state.value = null; recompute(); saveState(); return; }
    var v = C.parseInput(el.value);
    if (v === null) { cell.classList.add('invalid'); fitOwn(el); return; }   // 打到一半的非法输入：只标红，不动别的格子
    cell.classList.remove('invalid');
    state.unitId = el.dataset.unit; state.value = v;
    recompute(); saveState();
  });
  // 点格子空白处也能进入输入
  onUnits('click', function (e) {
    var cell = e.target.closest('.cell');
    if (cell && e.target.tagName !== 'INPUT') cell.querySelector('input').focus();
  });
  // 进入一格就全选：接着打字是替换而不是追加（iOS 真机行为未验证）
  onUnits('focusin', function (e) {
    var el = e.target;
    if (!el.dataset.unit || !el.value) return;
    requestAnimationFrame(function () { try { el.setSelectionRange(0, el.value.length); } catch (err) {} });
  });
  onUnits('keydown', function (e) { if (e.key === 'Enter' && e.target.dataset.unit) e.target.blur(); });
  $('sub').addEventListener('change', function (e) { state.sub = e.target.value; recompute(); saveState(); });
  // 归零 = 回到刚打开的样子：清空数字，物质也回到「按水」（2026-10-08 审查：原来物质不复位）。
  // 物品卡上也放一个，在下面输入完不用滑回顶部
  function reset() {
    D.units.forEach(function (u) { if (inputs[u.id]) { inputs[u.id].value = ''; inputs[u.id].closest('.cell').classList.remove('invalid'); } });
    state.unitId = null; state.value = null; state.sub = D.substances[0].id; $('sub').value = state.sub;
    recompute(); saveState();
  }
  $('btnReset').addEventListener('click', reset);
  $('btnReset2').addEventListener('click', reset);
  // 格子宽度变了，字号和位数要重新试。安卓弹键盘也会触发 resize，但宽度没变就不重算
  var lastW = window.innerWidth;
  window.addEventListener('resize', function () {
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth; availCache = null; recompute();
  });
  // 网页字体晚到会改变字宽：等字体就绪后清掉字宽缓存重算一次
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { charW = {}; recompute(); });

  // ---------- 模块导航：点击跳转 + 高亮跟随滚动（照 data-Calculation 的 setupSectionNav）----------
  (function setupSectionNav() {
    var nav = $('sectionNav');
    var btns = Array.prototype.slice.call(nav.querySelectorAll('.nav-item'));
    var cards = btns.map(function (b) { return $(b.dataset.target); });
    // 导航条实际多高就让卡片避多少，字号/安全区变了也不会错位
    function syncOffset() {
      document.documentElement.style.setProperty('--nav-offset', (nav.getBoundingClientRect().height + 16) + 'px');
    }
    syncOffset();
    window.addEventListener('resize', syncOffset);
    function mark(el) { btns.forEach(function (b, i) { b.setAttribute('aria-current', String(cards[i] === el)); }); }
    nav.addEventListener('click', function (e) {
      var b = e.target.closest('.nav-item');
      if (!b) return;
      var smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      // 第一张卡回到页面最顶（scrollIntoView 会停在离顶 12px 的地方，导航条上方露一截底）
      if (cards.indexOf($(b.dataset.target)) === 0) window.scrollTo({ top: 0, behavior: smooth ? 'smooth' : 'auto' });
      else $(b.dataset.target).scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
    });
    // 只认「落在视口中间那条窄带里」的卡片：比自己算 scroll 位置稳，也不会在两张卡交界处来回跳
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) { if (en.isIntersecting) mark(en.target); });
      }, { rootMargin: '-45% 0px -45% 0px', threshold: 0 });
      cards.forEach(function (c) { io.observe(c); });
    }
  })();

  restoreState();
  recompute();
  var savedMore = false;
  try { savedMore = localStorage.getItem(MORE_KEY) === '1'; } catch (err) {}
  setMore(savedMore);
  // 正在输入时不接管下拉：刷新会把刚输入的数清掉
  window.PullToRefresh.setupPullToRefresh({
    isBlocked: function () { var a = document.activeElement; return !!a && a.tagName === 'INPUT'; }
  });
})();
</script>
</body>
</html>
