<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="description" content="斤、两、克、毫升、杯、磅等重量与容量单位换算；输入几个鸡蛋、几张 A4 纸、几张人民币或几枚硬币，直接看多重">
<title>斤两换算</title>
<link rel="stylesheet" href="site.css?v=74f3b76d">
</head>
<body>
<div class="container">
  <nav class="section-nav" id="sectionNav" aria-label="模块导航">
    <button type="button" class="nav-item" data-target="cardConvert" aria-current="true">换算</button>
    <button type="button" class="nav-item" data-target="cardObjects" aria-current="false">物品</button>
  </nav>

  <section class="card" id="cardConvert" aria-labelledby="ttlConvert">
    <div class="head">
      <h1 id="ttlConvert"><button type="button" class="title-btn" id="btnSwitch" aria-haspopup="true" aria-expanded="false">斤两换算<span class="chev" aria-hidden="true"></span></button></h1>
      <div class="sub-wrap"><select class="sub-select" id="sub" aria-label="按什么东西换算重量和容量"></select></div>
      <button type="button" class="btn-icon" id="btnReset" aria-label="归零">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
      </button>
    </div>
    <div id="groups" class="units"></div>
    <div class="refer-row">
      <div class="refer" id="refer" aria-live="polite"></div>
      <button type="button" class="btn-more" id="btnMore" aria-expanded="false" aria-controls="more"><span id="moreText">更多单位</span><span class="chev" aria-hidden="true"></span></button>
    </div>
    <div id="more" class="units" hidden></div>
  </section>

  <section class="card" id="cardObjects" aria-labelledby="ttlObjects">
    <div class="head"><h2 id="ttlObjects">生活物品</h2>
      <button type="button" class="btn-icon" id="btnReset2" aria-label="归零">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
      </button>
    </div>
    <div id="objects" class="units"></div>
    <div class="obj-sum" id="objSum" aria-live="polite"></div>
    <p class="note">每一列按标题里的规格算。鸡蛋取商务部 SB/T 10638 中等蛋（58～64 克）的中值；A4 按 80 克复印纸；饮料和桶装油按包装容量 × 自身密度折成重量，不受上面「按水」选择影响；水泥按 GB 175 每袋 50 千克。人民币克重央行未公布：纸币按百元约 1.15 克的第三方称量值、再按票面面积推算；硬币按钱币目录（Numista 等）记载的重量，现行硬币取 2019 年版。都仅供参考。</p>
  </section>

</div>

<div id="ptr-indicator" aria-hidden="true">
  <svg class="ptr-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
  <svg class="ptr-spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
</div>
<div id="ptr-tip" hidden></div>

<script src="data.js?v=2c70ece2"></script>
<script src="core.js?v=be0b156e"></script>
<script src="convert.js?v=d7fcdbcd"></script>
<script src="pages.js?v=3d2403b2"></script>
<script src="nav.js?v=b7c9ccdb"></script>
<script src="pull-to-refresh.js?v=3e961870"></script>
<script src="grid.js?v=142a94eb"></script>
<script>
(function () {
  'use strict';
  // 斤两页专属：按什么物质换算、斤两组合写法、物品卡合计、「相当于」推荐。网格本身交给 grid.js
  var D = window.WV_DATA, C = window.WV;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  var tierOf = {};
  D.groups.forEach(function (g) { tierOf[g.id] = g.tier; });
  function isItem(u) { return tierOf[u.group] === 'items'; }

  var DEFAULT_SUB = D.substances[0].id, sub = DEFAULT_SUB;
  $('sub').innerHTML = D.substances.map(function (s) {
    return '<option value="' + s.id + '">按' + esc(s.name) + '</option>';
  }).join('');

  function after(state, r) {
    var has = r !== null;
    D.groups.forEach(function (g) {
      if (!g.composite) return;
      var c = has ? C.formatComposite(r.g, g.composite) : '';
      var b = document.querySelector('[data-comp="' + g.id + '"]');
      if (b) b.textContent = c ? (g.composite === 'jin_old' ? '旧制 ' + c : c) : '';
    });
    var pos = has && state.value > 0;
    var su = has ? C.unitById[state.unitId] : null;
    var sum = $('objSum');
    if (pos) {
      var comp = C.formatComposite(r.g, 'jin');
      sum.innerHTML = '合计 <b>' + esc(C.formatNumber(r.g)) + ' 克</b>' + (comp ? ' = <b>' + esc(comp) + '</b>' : '') +
        (su.vol ? ' · 内装 ' + esc(C.formatNumber(state.value * su.vol)) + ' 毫升'
                : su.kind === 'volume' ? ' · ' + esc(C.formatNumber(r.ml)) + ' 毫升' : '');
    } else sum.textContent = '输入几个、几张，这里显示合计多重，上面所有单位也一起算';
    var refer = $('refer');
    if (!pos) { refer.textContent = '在任意一格输入数字，其余单位自动算出'; return; }
    var sug = C.suggestItems(r.g, state.unitId).map(function (s) { return '<b>' + esc(C.suggestionText(s)) + '</b>'; });
    var sb = C.subById[sub];
    // 粉粒状的提示只在真的跨了重量/容量时才有意义：起点是物品格（已按自身密度折好）时不提示
    var cross = sb.granular && !isItem(su);
    refer.innerHTML = (sug.length ? '相当于 ' + sug.join('、') : '') +
      (cross ? '<span class="warn">' + esc(sb.name) + '装得松紧不同，克 ⇄ 毫升只是大概</span>' : '');
  }

  var menu = window.WVNav.mountSwitcher('weight');
  var grid = window.WVGrid.mount({
    data: D, key: 'weight',
    convert: function (v, id) { return C.convertAll(v, id, sub); },
    // 物品格写个数：≥1 留 1 位小数（数量本身是约数，6 位有效数字是假精度）
    texts: function (u, x) { return isItem(u) ? [C.formatCount(x), C.formatCell(x, 4), C.formatCell(x, 3)] : null; },
    after: after,
    // 物质跟输入一起存：刷新后接着用；归零时回到「按水」（2026-10-08 审查：原来物质不复位）
    extra: {
      get: function () { return { s: sub }; },
      set: function (o) { if (o.s && C.subById[o.s]) { sub = o.s; $('sub').value = sub; } },
      reset: function () { sub = DEFAULT_SUB; $('sub').value = sub; }
    },
    resetIds: ['btnReset', 'btnReset2'],   // 物品卡上也放一个，在下面输入完不用滑回顶部
    blocked: menu.isOpen
  });
  $('sub').addEventListener('change', function (e) { sub = e.target.value; grid.recompute(); grid.save(); });

  // ---------- 模块导航：点击跳转 + 高亮跟随滚动（照 data-Calculation 的 setupSectionNav）----------
  (function setupSectionNav() {
    var nav = $('sectionNav');
    var btns = Array.prototype.slice.call(nav.querySelectorAll('.nav-item'));
    var cards = btns.map(function (b) { return $(b.dataset.target); });
    // 导航条实际多高就让卡片避多少，字号/安全区变了也不会错位
    function syncOffset() {
      document.documentElement.style.setProperty('--nav-offset', (nav.getBoundingClientRect().height + 16) + 'px');
    }
    syncOffset();
    window.addEventListener('resize', syncOffset);
    function mark(el) { btns.forEach(function (b, i) { b.setAttribute('aria-current', String(cards[i] === el)); }); }
    nav.addEventListener('click', function (e) {
      var b = e.target.closest('.nav-item');
      if (!b) return;
      var smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      // 第一张卡回到页面最顶（scrollIntoView 会停在离顶 12px 的地方，导航条上方露一截底）
      if (cards.indexOf($(b.dataset.target)) === 0) window.scrollTo({ top: 0, behavior: smooth ? 'smooth' : 'auto' });
      else $(b.dataset.target).scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
    });
    // 只认「落在视口中间那条窄带里」的卡片：比自己算 scroll 位置稳，也不会在两张卡交界处来回跳
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) { if (en.isIntersecting) mark(en.target); });
      }, { rootMargin: '-45% 0px -45% 0px', threshold: 0 });
      cards.forEach(function (c) { io.observe(c); });
    }
  })();
})();
</script>
</body>
</html>
