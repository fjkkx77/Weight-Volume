<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="description" content="摄氏度、华氏度、开尔文、兰氏度等温度单位换算">
<title>温度换算</title>
<link rel="stylesheet" href="site.css?v=cf48cda7">
</head>
<body>
<!-- 本文件由 tools/build-pages.cjs 按 pages.js 生成，别手改 -->
<div class="container">
  <section class="card" id="cardConvert" aria-labelledby="ttlConvert">
    <div class="head">
      <a class="btn-icon btn-home" id="btnHome" href="./" aria-label="回到全部换算"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9v11h14V9"></path><path d="M10 20v-6h4v6"></path></svg></a>
      <h1 id="ttlConvert"><button type="button" class="title-btn" id="btnSwitch" aria-haspopup="true" aria-expanded="false">温度换算<span class="chev" aria-hidden="true"></span></button></h1>
      <button type="button" class="btn-icon btn-sign" id="btnSign" aria-label="正负号（输入零下温度）">±</button>
      <button type="button" class="btn-icon" id="btnReset" aria-label="归零">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
      </button>
    </div>
    <div id="groups" class="units"></div>
    <div class="refer-row">
      <div class="refer" id="refer" aria-live="polite"></div>
      <button type="button" class="btn-more" id="btnMore" aria-expanded="false" aria-controls="more"><span id="moreText">更多单位</span><span class="chev" aria-hidden="true"></span></button>
    </div>
    <div id="more" class="units" hidden></div>
  </section>
</div>

<div id="ptr-indicator" aria-hidden="true">
  <svg class="ptr-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
  <svg class="ptr-spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
</div>
<div id="ptr-tip" hidden></div>

<script src="core.js?v=be0b156e"></script>
<script src="pages.js?v=3d2403b2"></script>
<script src="nav.js?v=f8eb564d"></script>
<script src="data-temperature.js?v=4ba6362c"></script>
<script src="pull-to-refresh.js?v=3e961870"></script>
<script src="grid.js?v=ae5255c5"></script>
<script>
(function () {
  'use strict';
  var D = window.WV_TEMPERATURE, conv = window.WVCore.makeConverter(D.units);
  var menu = window.WVNav.mountSwitcher('temperature');
  var grid = window.WVGrid.mount({
    data: D, key: 'temperature', signed: !!D.signed, tinySci: !!D.tinySci, convert: conv.convertAll, texts: D.texts || null,
    validate: D.validate ? function (v, id) { return D.validate(conv.toBase(v, id)); } : null,
    blocked: menu.isOpen
  });
})();
</script>
</body>
</html>
